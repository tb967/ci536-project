<!DOCTYPE html>
<html lang="en">

    <title>Accessories - Marketplace</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js"></script>
</head>
<body>
    <header>
        <nav>
            <h1>Student Marketplace</h1>
            <ul>
                <li><a href="index.html">Home</a></li>

            </ul>
        </nav>

    <main>
