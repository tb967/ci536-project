<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace</title>
    <link rel="stylesheet" href="Css/style.css">
    <script src="Js/script.js"></script>
</head>
<body>
    <header>
        <nav>
            <h1>Student Marketplace</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="sell.html">Sell</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>
    
    <main>

        <h1>Product Categories</h1>

        <section class="products">
            <div class="product-card">
                <img src="Images/Electronics.jpg" alt="Electronics">
                <h2>Electronics</h2>
                <p>Price Range: £10.00 - £1000.00</p>
                <button class="browse-btn" onclick="location.href='electronics.html'">Browse Products</button>
            </div>
            
            <div class="product-card">
                <img src="Images/Accessories.jpg.webp" alt="Accessories">
                <h2>Accessories</h2>
                <p>Price Range: £1.00 - £100.00</p>
                <button class="browse-btn" onclick="location.href='accessories.html'">Browse Products</button>
            </div>

            <div class="product-card">
                <img src="Images/Furniture.webp" alt="Furniture">
                <h2>Furniture</h2>
                <p>Price Range: £15.00 - £500.00</p>
                <button class="browse-btn" onclick="location.href='furniture.html'">Browse Products</button>
            </div>

            <div class="product-card">
                <img src="Images/Material.jpg" alt="University Materials">
                <h2>University Materials</h2>
                <p>Price Range: £0.50 - £50.00</p>
                <button class="browse-btn" onclick="location.href='materials.html'">Browse Products</button>
            </div>

            <div class="product-card">
                <img src="Images/Travel.jpg" alt="Travel">
                <h2>Travel Essentials</h2>
                <p>Price Range: £5.00 - £100.00</p>
                <button class="browse-btn" onclick="location.href='travel.html'">Browse Products</button>
            </div>

        </section>
    </main>
    
</body>
</html>
