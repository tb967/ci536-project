<!DOCTYPE html>
<html>
<head>
    <title>Student Marketplace</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Student Marketplace</h1>
        
        <!-- Add Item Form -->
        <form id="add-item-form">
            <input type="text" id="item-title" placeholder="What are you selling?">
            <input type="number" id="item-price" placeholder="Price in $">
            <button type="submit">Add Item</button>
        </form>

        <!-- Items will show up here -->
        <div id="item-list"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
