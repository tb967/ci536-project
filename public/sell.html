<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace</title>
    <link rel="stylesheet" href="Css/style.css">
    <script src="Js/script.js" defer></script>
</head>
<body>
    
    <header>
        <nav>
            <h1>Student Marketplace</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="sell.html">Sell</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1>List your Items</h1>
        
        <!-- Enhanced Item Form -->
        <form id="add-item-form" enctype="multipart/form-data">
            <div class="form-group">
                <label for="item-title">Item Title*</label>
                <input type="text" id="item-title" name="item-title" placeholder="What are you selling?" required>
            </div>
            
            <div class="form-group">
                <label for="item-price">Price*</label>
                <input type="number" id="item-price" name="item-price" placeholder="Price in $" min="0" step="0.01" required>
            </div>
            
            <div class="form-group">
                <label for="item-category">Category*</label>
                <select id="item-category" name="item-category" required>
                    <option value="">Select a category</option>
                    <option value="textbooks">Textbooks</option>
                    <option value="electronics">Electronics</option>
                    <option value="furniture">Furniture</option>
                    <option value="clothing">Clothing</option>
                    <option value="school-supplies">School Supplies</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="item-condition">Condition*</label>
                <select id="item-condition" name="item-condition" required>
                    <option value="">Select condition</option>
                    <option value="new">New</option>
                    <option value="like-new">Like New</option>
                    <option value="good">Good</option>
                    <option value="fair">Fair</option>
                    <option value="poor">Poor</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="item-description">Description*</label>
                <textarea id="item-description" name="item-description" rows="5" 
                    placeholder="Provide details about your item (brand, model, age, features, etc.)" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="item-images">Upload Images (Max 3)*</label>
                <input type="file" id="item-images" name="item-images" accept="image/*" multiple required>
                <div id="image-preview" class="image-preview"></div>
            </div>
            
            <div class="form-group">
                <h3>Contact Information</h3>
                
                <div class="contact-field">
                    <label for="contact-name">Your Name*</label>
                    <input type="text" id="contact-name" name="contact-name" required>
                </div>
                
                <div class="contact-field">
                    <label for="contact-email">Email*</label>
                    <input type="email" id="contact-email" name="contact-email" required>
                </div>
                
                <div class="contact-field">
                    <label for="contact-phone">Phone Number</label>
                    <input type="tel" id="contact-phone" name="contact-phone">
                </div>
                
                <div class="contact-field">
                    <label for="contact-method">Preferred Contact Method*</label>
                    <select id="contact-method" name="contact-method" required>
                        <option value="email">Email</option>
                        <option value="phone">Phone</option>
                        <option value="both">Both</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <button type="submit" class="submit-btn">List Item for Sale</button>
            </div>
        </form>

        <!-- Items will show up here -->
        <div id="item-list"></div>
    </div>
   
</body>
</html>
